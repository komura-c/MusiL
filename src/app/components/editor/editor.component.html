@if (quillComponentLoaded) {
<div [formGroup]="parentForm">
  <app-quill-editor
    formControlName="editorContent"
    [modules]="quillModules"
    placeholder="音楽に関する知識を記録してみましょう！例：今日は〇〇の曲を自分なりに分析してみました"
    (editorCreated)="editorCreated($event)"
    [defaultEmptyValue]="''"
    [scrollingContainer]="'.container__scroll'"
  >
  </app-quill-editor>
  <input
    type="file"
    accept="image/png, image/jpeg"
    (input)="onInsertImageEvent($event)"
    #imageInput
  />
</div>
}
