<h1>check</h1>
<h2>screenName</h2>
@if (usersScreenNameIsNull$ | async; as users) { @for (user of users; track
user) {
<div>
  <p>{{ user | json }}</p>
</div>
} }

<h2>thumbnailURL</h2>
@if (articlesThumbnailURLIsNull$ | async; as articles) { @for (article of
articles; track article) {
<div>
  <p>{{ article.articleId }}</p>
</div>
} }
