@if (articles$ | async; as articles) {
<div class="my-articles" [class.fade]="articles">
  @for (article of articles; track article) { @if (article) {
  <app-article-card [article]="article"></app-article-card>
  } }
</div>
} @else { @if (!isLoading) {
<div class="no-article">
  <p>まだ、投稿した記事はありません。</p>
</div>
} } @if (isLoading) {
<mat-spinner class="loading-bar" diameter="55" strokeWidth="4"></mat-spinner>
}
